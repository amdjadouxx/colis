<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Frais par categorie</title>
<style>
:root{--bg:#f3f4f7;--surface:#fff;--fg:#15171d;--muted:#5b6170;--line:#d6d9e2;
  --accent:#2f3f8f;--warn:#8a5a00;--cost:#8f2228;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111319;--surface:#1a1d25;--fg:#e8eaf1;
  --muted:#99a0b1;--line:#2b303c;--accent:#95a5ff;--warn:#e2b45e;--cost:#ff9093;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;width:400px;max-height:580px;overflow-y:auto;background:var(--bg);color:var(--fg);
  font:13px/1.45 "Segoe UI",system-ui,sans-serif}
.pad{padding:12px 14px}
h1{font-size:14px;margin:0 0 2px}
.sub{color:var(--muted);font-size:11.5px;margin:0}
.big{font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;margin-top:10px}
.big small{font-size:12px;font-weight:600;color:var(--muted)}
.cost{color:var(--cost);font-weight:700;font-size:16px;margin-top:4px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  padding:6px 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
td{padding:6px 14px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hot{color:var(--cost);font-weight:700}
.code{font:10px ui-monospace,Consolas,monospace;color:var(--muted)}
.note{margin:8px 14px;padding-left:9px;border-left:2px solid var(--accent);font-size:11.5px}
.note.bad{border-left-color:var(--cost)}
.msg{padding:14px;color:var(--muted)}
.how{padding:8px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:10.5px}
</style>
</head>
<body>
<div class="pad">
  <h1>Frais par categorie</h1>
  <p class="sub">Lecture locale de la page ouverte. Rien n'est envoye.</p>
</div>
<div id="out"><div class="msg">Lecture du panier…</div></div>
<script type="module" src="popup.js"></script>
</body>
</html>
