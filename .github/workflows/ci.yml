name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci

      # Suite unitaire et d invariants. Aucune dependance de test.
      - run: npm test

      # Verifie que les bugs connus font bien rougir la suite : un test qui
      # passe ne prouve rien s il passe aussi quand on casse le code.
      - run: npm run check:negative

      # La page livree doit calculer comme les sources.
      - run: npm run build:local
      - run: npm run verify:local

      # Les tests d extraction demandent un navigateur : ils tournent en local
      # avec Chrome, et sont volontairement hors CI pour ne pas dependre d un
      # binaire installe par le runner.
