name: data

on:
  schedule:
    # Nomenclature TARIC : publiee le 1er de chaque mois.
    - cron: "0 6 2 * *"
    # Veille reglementaire : tous les jours.
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  taric:
    if: github.event.schedule != '0 7 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node tools/taric-sync/sync.js
      - name: Ouvrir une PR si la nomenclature a bouge
        uses: peter-evans/create-pull-request@v6
        with:
          title: "data: nouvelle release TARIC"
          branch: data/taric
          commit-message: "data: synchronise la nomenclature TARIC"

  rules:
    if: github.event.schedule != '0 6 2 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      # Echoue si un montant du bareme n est plus confirme par les sources.
      # Le bareme reste modifie a la main, jamais par le job.
      - run: node tools/rules-watch/watch.js
        env:
          LINKUP_API_KEY: ${{ secrets.LINKUP_API_KEY }}
